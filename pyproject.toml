[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pqblocks-csr-pop"
version = "0.1.0"
description = "ML-KEM (FIPS 203) PKCS#10 Certificate Signing Request (CSR) generator with RFC 9883 Proof of Possession (PoP)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{name = "The PQBlocks Authors"}]
keywords = ["post-quantum", "pqc", "ml-kem", "csr", "pkcs10", "rfc-9883", "proof-of-possession"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cryptography"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "numpy", "scipy"]

[project.urls]
Homepage = "https://github.com/PQBlocks/mlkem-csr-pop"
Documentation = "https://github.com/PQBlocks/mlkem-csr-pop#readme"
Source = "https://github.com/PQBlocks/mlkem-csr-pop"
Changelog = "https://github.com/PQBlocks/mlkem-csr-pop/blob/main/CHANGELOG.md"
Issues = "https://github.com/PQBlocks/mlkem-csr-pop/issues"
Security = "https://github.com/PQBlocks/mlkem-csr-pop/security/policy"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
